# Cross-compile configuration.
#
# When cargo builds for `aarch64-unknown-linux-gnu` on a host that
# has the cross toolchain installed (Debian/Ubuntu: install
# `gcc-aarch64-linux-gnu libc6-dev-arm64-cross`), it needs to know
# which linker to use. Setting it here means local cross-builds
# work without bespoke CARGO_TARGET_*_LINKER env vars.
#
# CI uses `cargo-cross` (the `cross` binary from
# https://github.com/cross-rs/cross) via
# .github/workflows/release.yml, which pulls a Docker image with
# the right cross toolchain preinstalled and configures
# target-specific env automatically. This file only affects local
# `cargo build --target aarch64-unknown-linux-gnu` invocations on
# a developer machine that has the cross tools installed.

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
