[workspace]
members = ["crates/twig-core", "crates/twig-wasm"]
resolver = "2"

[package]
name = "twig"
version = "3.2.0"
description = "Explore JSON, YAML, and HAR locally in your terminal, with a Rust core shared by the Twig web explorer."
readme = "README.md"
authors = ["Shubham Kumar"]
license = "MIT"
edition = "2021"
rust-version = "1.88"
repository = "https://github.com/workdone0/twig"
keywords = ["json", "yaml", "viewer", "terminal", "tui"]
categories = ["command-line-utilities", "data-structures"]

[[bin]]
name = "twig"
path = "src/main.rs"

[lib]
name = "twig"
path = "src/lib.rs"

[dependencies]
twig-core = { path = "crates/twig-core" }
ratatui = "0.30"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
arboard = { version = "3", default-features = false }
jsonrepair = "0.1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
owo-colors = { version = "4", features = ["supports-colors"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"
anyhow = "1"
thiserror = "1"

sha2 = "0.10"
tempfile = "3"
unicode-width = "0.2"
unicode-segmentation = "1"
serde_norway = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
