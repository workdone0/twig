name: Auto release after CI
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
permissions:
  contents: write
  actions: write
concurrency:
  group: auto-release
  cancel-in-progress: false
jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Tag verified commit and dispatch unpublished release
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            if [[ "$(git rev-parse "$TAG^{commit}")" != "$VERIFIED_SHA" ]]; then
              echo "Version already tagged at another commit; bump the package version"
              exit 0
            fi
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" "$VERIFIED_SHA" -m "Release $TAG"
            git push origin "$TAG"
          fi
          # Always retry dispatch when the release is absent, even if the tag exists.
          gh workflow run release.yml --ref "$TAG" -f tag="$TAG"
