name: CI

on:
  push:
    branches: [master, rewrite/rust-port]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: cargo test --locked --all-targets

  shellcheck:
    name: Lint install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck on install.sh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck install.sh

  miri:
    # Miri runs only the model + paths tests. core::store and
    # core::config pull in rusqlite, which uses C FFI to SQLite and
    # therefore can't be interpreted by Miri.
    name: Miri (Linux, pure-Rust modules only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain with miri
        run: |
          rustup toolchain install nightly --component miri rustfmt
          rustup default nightly
      - name: Cache cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: miri-${{ hashFiles('Cargo.lock') }}
      - name: Run miri on model + paths
        run: |
          cargo miri setup
          cargo miri test --lib -- core::model core::paths --no-fail-fast

  bench:
    name: Load test (50MB synthetic JSON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bench-${{ hashFiles('Cargo.lock') }}
      - name: Build release
        run: cargo build --release --locked
      # Generate ~50MB of synthetic JSON. We aim for 50MB+, not the
      # 11MB that 20k items produced in earlier versions of this
      # job. 90k items gets us there with room to grow.
      - name: Generate 50MB synthetic JSON
        run: |
          python3 - <<'EOF'
          import json, random
          random.seed(42)
          root = {
              "items": [
                  {
                      "id": i,
                      "uuid": f"item-{i:08x}",
                      "tags": random.sample(["red", "blue", "green", "yellow", "purple"], k=3),
                      "payload": {
                          "nested": list(range(10)),
                          "label": "x" * 200,
                          "deep": [{"k": j, "v": i * j} for j in range(10)],
                      },
                  }
                  for i in range(90000)
              ]
          }
          with open("/tmp/big.json", "w") as f:
              json.dump(root, f)
          EOF
          ls -lh /tmp/big.json
      # twig --check exercises the streaming JSON ingestion pipeline
      # without opening a TUI, so it works in CI's non-TTY environment.
      - name: Load via twig --check
        run: |
          time ./target/release/twig --check /tmp/big.json