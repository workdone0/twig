name: Release

on:
  # Tag-push trigger does not fire when the tag was created by another
  # workflow using GITHUB_TOKEN (a documented GitHub Actions security
  # limitation). The auto-release workflow handles dispatching via
  # `gh workflow run release.yml` after creating the tag; this trigger
  # is kept for manually-pushed tags (e.g. maintainer running
  # `git push origin vX.Y.Z` from a local clone with a PAT).
  push:
    tags:
      - 'v*'
  # Manual dispatch — used by auto-release.yml after it creates the
  # tag, and by maintainers who want to re-build binaries for an
  # existing tag without bumping Cargo.toml. Pass `tag` (e.g. v3.0.0)
  # as input; defaults to the current commit's tag if any.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach binaries to (e.g. v3.0.0). Leave blank to use the tag of the current commit if any.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Asset names MUST match what install.sh builds via
          # detect_target(). On Linux: <arch>-unknown-linux-gnu.
          # On macOS: <arch>-apple-darwin. On Windows: pc-windows-msvc.
          # Each target runs on the runner OS it needs natively:
          #   - Linux targets -> ubuntu-latest
          #   - macOS targets -> macos-14 (Apple Silicon; SDK ships both arches)
          #   - Windows target -> windows-latest (MSVC is not portable)
          #
          # `build_method` is either `cargo` (native; use the host's
          # cargo + toolchain) or `cross` (cargo-cross; pulls a
          # Docker image with the right cross toolchain for the
          # target). We use cross for aarch64-unknown-linux-gnu
          # because hand-installing gcc-aarch64-linux-gnu and
          # binutils-aarch64-linux-gnu on ubuntu-latest proved
          # unreliable (apt-get reports success but the cross
          # binaries don't end up on PATH in fresh shells).
          - target: x86_64-unknown-linux-gnu
            archive: twig-x86_64-unknown-linux-gnu
            binary: twig
            ext: ''
            os: ubuntu-latest
            build_method: cargo
          - target: aarch64-unknown-linux-gnu
            archive: twig-aarch64-unknown-linux-gnu
            binary: twig
            ext: ''
            os: ubuntu-latest
            build_method: cross
          - target: x86_64-apple-darwin
            archive: twig-x86_64-apple-darwin
            binary: twig
            ext: ''
            os: macos-14
            build_method: cargo
          - target: aarch64-apple-darwin
            archive: twig-aarch64-apple-darwin
            binary: twig
            ext: ''
            os: macos-14
            build_method: cargo
          - target: x86_64-pc-windows-msvc
            archive: twig-x86_64-pc-windows-msvc
            binary: twig.exe
            ext: '.exe'
            os: windows-latest
            build_method: cargo

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          # llvm-tools gives us llvm-strip, which understands any
          # architecture and is the reliable cross-arch stripper.
          components: llvm-tools

      - name: Install cargo-cross
        if: matrix.build_method == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Build (cross)
        if: matrix.build_method == 'cross'
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.build_method == 'cargo'
        env:
          # cc-rs (used by rusqlite-sys's build script to compile
          # bundled SQLite from C) reads its compiler from these
          # target-prefixed env vars. We only set them for
          # aarch64, but `cross` already handles the cross-compile
          # env, so this step only runs for native builds where
          # they're harmless if unset.
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --locked --target ${{ matrix.target }}

      # `strip` is a Unix binary; macOS has it too, Windows does not.
      # llvm-strip from the llvm-tools rustup component is multi-arch
      # and reliable; we prefer it. Falls back to the host strip
      # with a non-fatal warning (so a wrong-arch strip on a
      # partially-set-up runner doesn't crash the build).
      - name: Strip binary (Unix only)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -e
          BINARY="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          TRIPLE_STRIP="${{ matrix.target }}-strip"
          if command -v llvm-strip >/dev/null 2>&1; then
            echo "Using llvm-strip (multi-arch)"
            llvm-strip "$BINARY"
          elif command -v "$TRIPLE_STRIP" >/dev/null 2>&1; then
            echo "Using cross strip: $TRIPLE_STRIP"
            "$TRIPLE_STRIP" "$BINARY"
          elif command -v strip >/dev/null 2>&1; then
            echo "::warning::Using system strip; if it fails the binary is the wrong arch"
            strip "$BINARY" || echo "::warning::strip failed, binary left unstripped"
          else
            echo "::warning::no strip available; binary left unstripped"
          fi

      # Package as a tarball containing a file named `twig` (or `twig.exe`)
      # so install.sh can extract the binary by predictable name.
      - name: Package tarball
        shell: bash
        run: |
          mkdir -p release-artifacts/staging
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
             "release-artifacts/staging/twig${{ matrix.ext }}"
          (cd release-artifacts/staging && tar -czf "../${{ matrix.archive }}.tar.gz" \
              "twig${{ matrix.ext }}")
          rm -rf release-artifacts/staging
          ls -la release-artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: release-artifacts/${{ matrix.archive }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Need full history so `git describe` against the tag ref
          # works for the softprops action's tag_name resolution.
          fetch-depth: 0
          # fetch-depth: 0 alone does NOT fetch tags. We need an
          # explicit tag fetch so the tag-existence check below has
          # something to look at.
          fetch-tags: true

      - name: Resolve target tag
        id: tag
        run: |
          INPUT_TAG="${{ inputs.tag }}"
          if [[ -n "$INPUT_TAG" ]]; then
            # Normalize: "3.0.0" -> "v3.0.0"
            case "$INPUT_TAG" in
              v*) TAG="$INPUT_TAG" ;;
              *)  TAG="v$INPUT_TAG" ;;
            esac
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            echo "::error::no tag specified and current ref is not a tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "target tag: $TAG"

      - name: Verify tag exists on origin
        # Note: we deliberately do NOT verify the tag is present in
        # the local checkout. actions/checkout with fetch-depth: 0
        # and fetch-tags: true is unreliable for tags not directly
        # on the current branch tip on some checkout versions --
        # we'd hit 'Needed a single revision' on `git rev-parse`
        # even though the tag clearly exists on origin (since
        # softprops will resolve and publish it just fine).
        # Querying origin directly via ls-remote is the reliable
        # check: if the tag is there, softprops will work; if not,
        # we fail fast with a clear error before any artifacts
        # are uploaded.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "::error::tag ${TAG} does not exist on origin"
            exit 1
          fi
          echo "tag ${TAG} confirmed on origin"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate sha256sum files
        run: |
          cd artifacts
          # Format must be "<hash>  <filename>" (two spaces) for
          # sha256sum -c to verify in place. install.sh uses these.
          for f in *.tar.gz; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          # When the tag was just created by auto-release.yml, the
          # release may not exist yet (softprops will create it).
          # If it does exist (re-run), softprops updates it.
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
