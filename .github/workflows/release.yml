name: Release

on:
  # Tag-push trigger does not fire when the tag was created by another
  # workflow using GITHUB_TOKEN (a documented GitHub Actions security
  # limitation). The auto-release workflow handles dispatching via
  # `gh workflow run release.yml` after creating the tag; this trigger
  # is kept for manually-pushed tags (e.g. maintainer running
  # `git push origin vX.Y.Z` from a local clone with a PAT).
  push:
    tags:
      - 'v*'
  # Manual dispatch — used by auto-release.yml after it creates the
  # tag, and by maintainers who want to re-build binaries for an
  # existing tag without bumping Cargo.toml. Pass `tag` (e.g. v3.0.0)
  # as input; defaults to the current commit's tag if on a tag ref.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach binaries to (e.g. v3.0.0). Leave blank to use the tag of the current commit if any.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Asset names MUST match what install.sh builds via
          # detect_target(). On Linux: <arch>-unknown-linux-gnu.
          # On macOS: <arch>-apple-darwin. On Windows: pc-windows-msvc.
          - target: x86_64-unknown-linux-gnu
            archive: twig-x86_64-unknown-linux-gnu
            binary: twig
            ext: ''
          - target: aarch64-unknown-linux-gnu
            archive: twig-aarch64-unknown-linux-gnu
            binary: twig
            ext: ''
          - target: x86_64-apple-darwin
            archive: twig-x86_64-apple-darwin
            binary: twig
            ext: ''
          - target: aarch64-apple-darwin
            archive: twig-aarch64-apple-darwin
            binary: twig
            ext: ''
          - target: x86_64-pc-windows-msvc
            archive: twig-x86_64-pc-windows-msvc
            binary: twig.exe
            ext: '.exe'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip binary (Unix only)
        if: matrix.target != 'x86_64-pc-windows-msvc'
        run: |
          strip "target/${{ matrix.target }}/release/${{ matrix.binary }}"

      # Package as a tarball containing a file named `twig` (or `twig.exe`)
      # so install.sh can extract the binary by predictable name.
      - name: Package tarball
        run: |
          mkdir -p release-artifacts/staging
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
             "release-artifacts/staging/twig${{ matrix.ext }}"
          (cd release-artifacts/staging && tar -czf "../${{ matrix.archive }}.tar.gz" \
              "twig${{ matrix.ext }}")
          rm -rf release-artifacts/staging
          ls -la release-artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: release-artifacts/${{ matrix.archive }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so `git describe` against the tag ref
          # works for the softprops action's tag_name resolution.
          fetch-depth: 0

      - name: Resolve target tag
        id: tag
        run: |
          INPUT_TAG="${{ inputs.tag }}"
          if [[ -n "$INPUT_TAG" ]]; then
            # Normalize: "3.0.0" -> "v3.0.0"
            case "$INPUT_TAG" in
              v*) TAG="$INPUT_TAG" ;;
              *)  TAG="v$INPUT_TAG" ;;
            esac
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            echo "::error::no tag specified and current ref is not a tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "target tag: $TAG"

      - name: Verify tag exists locally
        run: git fetch --tags && git rev-parse "refs/tags/${{ steps.tag.outputs.tag }}"^{}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate sha256sum files
        run: |
          cd artifacts
          # Format must be "<hash>  <filename>" (two spaces) for
          # sha256sum -c to verify in place. install.sh uses these.
          for f in *.tar.gz; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          # When the tag was just created by auto-release.yml, the
          # release may not exist yet (softprops will create it).
          # If it does exist (re-run), softprops updates it.
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true