name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (vX.Y.Z)'
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag'; exit 1; }
          SHA=$(git rev-parse "$TAG^{commit}")
          VERSION=$(git show "$SHA:Cargo.toml" | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -1)
          [[ "$TAG" == "v$VERSION" ]] || { echo 'Tag and manifest version differ'; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
  verify:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
  build:
    needs: [resolve, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, method: cargo, binary: twig}
          - {target: aarch64-unknown-linux-gnu, os: ubuntu-22.04, method: cross, binary: twig}
          - {target: x86_64-apple-darwin, os: macos-14, method: cargo, binary: twig}
          - {target: aarch64-apple-darwin, os: macos-14, method: cargo, binary: twig}
          - {target: x86_64-pc-windows-msvc, os: windows-latest, method: cargo, binary: twig.exe}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        if: matrix.method == 'cross'
        with:
          tool: cross
      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: ${{ matrix.method }} build --locked --release --target ${{ matrix.target }}
      - name: Package and record provenance
        shell: bash
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          TAG: ${{ needs.resolve.outputs.tag }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          mkdir -p artifacts staging
          cp "target/$TARGET/release/$BINARY" staging/
          cp LICENSE staging/
          tar -czf "artifacts/twig-$TARGET.tar.gz" -C staging "$BINARY" LICENSE
          {
            echo "tag=$TAG"
            echo "commit=$SHA"
            echo "target=$TARGET"
            rustc --version
            wc -c "target/$TARGET/release/$BINARY"
            if command -v file >/dev/null; then file "target/$TARGET/release/$BINARY"; fi
            if [[ "$TARGET" == *apple* ]]; then otool -L "target/$TARGET/release/$BINARY"; fi
            if [[ "$TARGET" == x86_64-unknown-linux-gnu ]]; then ldd "target/$TARGET/release/$BINARY"; fi
          } > "artifacts/twig-$TARGET.build.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: twig-${{ matrix.target }}
          path: artifacts/*
  publish:
    needs: [resolve, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          for file in *.tar.gz; do sha256sum "$file" > "$file.sha256"; done
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.sha }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*
          fail_on_unmatched_files: true
      - name: Dispatch website deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --ref master
